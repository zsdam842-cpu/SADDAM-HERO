name: Godot Android Build

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.3-stable
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_PLATFORM: "android-34"

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot and export templates
        run: |
          curl -sSL -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -sSL -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mv /tmp/templates/templates "$HOME/.local/share/godot/export_templates/4.3.stable"
          godot --version

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;${ANDROID_PLATFORM}"

      - name: Configure Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$HOME/.android/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/force_system_user = false
          EOF

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Headless startup smoke test
        run: timeout 60s godot --headless --path . --quit-after 10

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/SADDAM-HERO.apk

      - name: Verify APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          AAPT2="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          "$APKSIGNER" verify build/SADDAM-HERO.apk
          "$AAPT2" dump badging build/SADDAM-HERO.apk | head -4
          ls -lh build/SADDAM-HERO.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADDAM-HERO-android-debug
          path: build/SADDAM-HERO.apk
          if-no-files-found: error
